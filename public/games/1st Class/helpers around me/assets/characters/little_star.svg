<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="60%" stop-color="#FFD43B" />
      <stop offset="100%" stop-color="#F59F00" />
    </radialGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Glow Aura -->
  <circle cx="100" cy="100" r="85" fill="#FFE066" opacity="0.35" filter="url(#starGlow)"/>
  
  <!-- Star Body -->
  <polygon points="100,18 123,72 182,73 135,108 152,164 100,130 48,164 65,108 18,73 77,72"
           fill="url(#starGrad)" stroke="#E67700" stroke-width="4" stroke-linejoin="round" />
  
  <!-- Rosy Cheeks -->
  <ellipse cx="68" cy="108" rx="10" ry="7" fill="#FF8787" opacity="0.8" />
  <ellipse cx="132" cy="108" rx="10" ry="7" fill="#FF8787" opacity="0.8" />
  
  <!-- Big Friendly Eyes -->
  <ellipse cx="78" cy="95" rx="8" ry="12" fill="#212529" />
  <ellipse cx="122" cy="95" rx="8" ry="12" fill="#212529" />
  <!-- Eye Highlights -->
  <circle cx="75" cy="90" r="3.5" fill="#FFFFFF" />
  <circle cx="80" cy="97" r="1.5" fill="#FFFFFF" />
  <circle cx="119" cy="90" r="3.5" fill="#FFFFFF" />
  <circle cx="124" cy="97" r="1.5" fill="#FFFFFF" />
  
  <!-- Happy Smile -->
  <path d="M 85 110 Q 100 128 115 110" fill="none" stroke="#212529" stroke-width="4" stroke-linecap="round" />
  <!-- Tongue -->
  <path d="M 92 117 Q 100 126 108 117 Z" fill="#FA5252" />
  
  <!-- Tiny Arms -->
  <path d="M 46 112 Q 28 105 32 90" fill="none" stroke="#F59F00" stroke-width="5" stroke-linecap="round" />
  <path d="M 154 112 Q 172 105 168 90" fill="none" stroke="#F59F00" stroke-width="5" stroke-linecap="round" />
  
  <!-- Tiny Feet -->
  <ellipse cx="82" cy="160" rx="9" ry="6" fill="#F59F00" />
  <ellipse cx="118" cy="160" rx="9" ry="6" fill="#F59F00" />
  
  <!-- Sparkles -->
  <polygon points="35,30 38,40 48,43 38,46 35,56 32,46 22,43 32,40" fill="#FFF" opacity="0.9" />
  <polygon points="165,35 167,43 175,45 167,47 165,55 163,47 155,45 163,43" fill="#FFF" opacity="0.9" />
</svg>
