<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Little Star Character -->
    <g id="char-little-star">
      <filter id="star-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
      <!-- Star Body -->
      <path d="M 50,5 L 63,35 L 95,38 L 70,60 L 78,92 L 50,75 L 22,92 L 30,60 L 5,38 L 37,35 Z"
            fill="url(#star-grad)" stroke="#FFF275" stroke-width="3" filter="url(#star-glow)"/>
      <!-- Rosy Cheeks -->
      <circle cx="35" cy="55" r="5" fill="#FF8BA7" opacity="0.6"/>
      <circle cx="65" cy="55" r="5" fill="#FF8BA7" opacity="0.6"/>
      <!-- Friendly Eyes -->
      <ellipse cx="40" cy="48" rx="4" ry="5.5" fill="#2B2D42"/>
      <ellipse cx="60" cy="48" rx="4" ry="5.5" fill="#2B2D42"/>
      <circle cx="41.5" cy="46" r="1.8" fill="#FFFFFF"/>
      <circle cx="61.5" cy="46" r="1.8" fill="#FFFFFF"/>
      <!-- Happy Smile -->
      <path d="M 43,56 Q 50,64 57,56" fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Sparkle Crown -->
      <circle cx="50" cy="18" r="3" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Star Gradient -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>

    <!-- John Character (Friendly Space Boy) -->
    <g id="char-john">
      <!-- Shadow -->
      <ellipse cx="60" cy="132" rx="35" ry="8" fill="rgba(0,0,0,0.25)"/>
      <!-- Legs / Shoes -->
      <rect x="42" y="98" width="14" height="24" rx="7" fill="#E0A96D"/>
      <rect x="64" y="98" width="14" height="24" rx="7" fill="#E0A96D"/>
      <!-- Socks & Sneakers -->
      <rect x="40" y="116" width="18" height="8" rx="4" fill="#EBF4FF"/>
      <rect x="62" y="116" width="18" height="8" rx="4" fill="#EBF4FF"/>
      <path d="M 36,122 Q 49,122 58,124 Q 58,129 36,129 Z" fill="#3A86FF"/>
      <path d="M 62,124 Q 71,122 84,122 Q 84,129 62,129 Z" fill="#3A86FF"/>
      <circle cx="47" cy="125" r="2" fill="#FFFFFF"/>
      <circle cx="73" cy="125" r="2" fill="#FFFFFF"/>

      <!-- Cargo Shorts -->
      <path d="M 38,78 L 82,78 L 86,102 L 64,102 L 60,88 L 56,102 L 34,102 Z" fill="#D4A373"/>
      <rect x="36" y="86" width="10" height="10" rx="2" fill="#C38E5B"/>
      <rect x="74" y="86" width="10" height="10" rx="2" fill="#C38E5B"/>

      <!-- T-Shirt Body (Space Blue with Rocket) -->
      <path d="M 35,52 Q 60,48 85,52 L 82,82 L 38,82 Z" fill="#00B4D8"/>
      <!-- Sleeves -->
      <path d="M 36,52 L 22,66 L 32,74 L 40,60 Z" fill="#0096C7"/>
      <path d="M 84,52 L 98,66 L 88,74 L 80,60 Z" fill="#0096C7"/>

      <!-- Rocket Icon on Shirt -->
      <g transform="translate(52, 58) scale(0.35)">
        <path d="M 20,0 Q 35,15 35,40 L 5,40 Q 5,15 20,0 Z" fill="#FF5964"/>
        <circle cx="20" cy="22" r="6" fill="#FFFFFF"/>
        <circle cx="20" cy="22" r="3.5" fill="#0077B6"/>
        <path d="M 5,30 L -5,42 L 5,40 Z" fill="#F4A261"/>
        <path d="M 35,30 L 45,42 L 35,40 Z" fill="#F4A261"/>
        <path d="M 12,40 L 20,52 L 28,40 Z" fill="#FFD166"/>
      </g>

      <!-- Arms & Hands (Pointing gesture) -->
      <rect x="18" y="65" width="12" height="18" rx="6" fill="#FCD5B5"/>
      <circle cx="24" cy="84" r="7" fill="#FCD5B5"/>
      <!-- Right Arm Raised & Pointing Up -->
      <path d="M 88,62 Q 102,48 106,32" fill="none" stroke="#FCD5B5" stroke-width="12" stroke-linecap="round"/>
      <!-- Pointing Hand -->
      <circle cx="107" cy="30" r="7" fill="#FCD5B5"/>
      <path d="M 107,30 L 112,18" fill="none" stroke="#FCD5B5" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Neck -->
      <rect x="53" y="44" width="14" height="10" rx="3" fill="#FCD5B5"/>

      <!-- Head / Face -->
      <ellipse cx="60" cy="34" rx="22" ry="20" fill="#FCD5B5"/>
      <!-- Rosy Cheeks -->
      <circle cx="44" cy="38" r="4.5" fill="#FF8BA7" opacity="0.6"/>
      <circle cx="76" cy="38" r="4.5" fill="#FF8BA7" opacity="0.6"/>
      <!-- Big Expressive Brown Eyes -->
      <ellipse cx="49" cy="32" rx="4.5" ry="6" fill="#3D2619"/>
      <ellipse cx="71" cy="32" rx="4.5" ry="6" fill="#3D2619"/>
      <circle cx="50.5" cy="30" r="2" fill="#FFFFFF"/>
      <circle cx="72.5" cy="30" r="2" fill="#FFFFFF"/>
      <circle cx="48" cy="34.5" r="1" fill="#FFFFFF"/>
      <circle cx="70" cy="34.5" r="1" fill="#FFFFFF"/>
      <!-- Eyebrows -->
      <path d="M 44,24 Q 49,21 54,23" fill="none" stroke="#3D2619" stroke-width="2" stroke-linecap="round"/>
      <path d="M 66,23 Q 71,21 76,24" fill="none" stroke="#3D2619" stroke-width="2" stroke-linecap="round"/>
      <!-- Cute Nose & Big Warm Smile -->
      <circle cx="60" cy="35" r="2" fill="#E59866"/>
      <path d="M 52,38 Q 60,46 68,38" fill="none" stroke="#9A3412" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 54,39 Q 60,45 66,39 Z" fill="#EA580C" opacity="0.5"/>

      <!-- Ears -->
      <ellipse cx="38" cy="34" rx="4" ry="6" fill="#FCD5B5"/>
      <ellipse cx="82" cy="34" rx="4" ry="6" fill="#FCD5B5"/>

      <!-- Spiky Brown Hair -->
      <path d="M 38,30 Q 36,12 52,10 Q 56,2 66,6 Q 78,4 82,16 Q 86,22 84,30 Q 78,16 60,16 Q 44,16 38,30 Z" fill="#4A2810"/>
      <path d="M 50,10 Q 58,-2 70,6" fill="none" stroke="#381E0C" stroke-width="3"/>
    </g>

    <!-- Space Machine (The Zeroizer) -->
    <g id="zeroizer-machine">
      <!-- Outer Chamber Glow -->
      <rect x="15" y="15" width="170" height="210" rx="30" fill="url(#machine-body-grad)" stroke="#4CC9F0" stroke-width="4"/>
      <!-- Glass Tube / Energy Window -->
      <rect x="35" y="45" width="130" height="135" rx="20" fill="url(#chamber-glow-grad)" stroke="#7209B7" stroke-width="3"/>
      <!-- Glowing Power Nodes -->
      <circle cx="45" cy="30" r="7" fill="#4ADE80"/>
      <circle cx="100" cy="25" r="9" fill="#F72585"/>
      <circle cx="155" cy="30" r="7" fill="#4ADE80"/>
      <!-- Energy Coils / Electrodes -->
      <path d="M 35,70 L 25,70 M 35,110 L 25,110 M 35,150 L 25,150" stroke="#4CC9F0" stroke-width="4" stroke-linecap="round"/>
      <path d="M 165,70 L 175,70 M 165,110 L 175,110 M 165,150 L 175,150" stroke="#4CC9F0" stroke-width="4" stroke-linecap="round"/>
      <!-- Base Stand -->
      <path d="M 30,225 L 170,225 L 185,245 L 15,245 Z" fill="#1E1B4B" stroke="#4CC9F0" stroke-width="3"/>
      <circle cx="100" cy="235" r="5" fill="#F72585"/>
    </g>

    <!-- Gradients -->
    <linearGradient id="machine-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E38"/>
      <stop offset="50%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#120E2E"/>
    </linearGradient>

    <linearGradient id="chamber-glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(76, 201, 240, 0.25)"/>
      <stop offset="50%" stop-color="rgba(114, 9, 183, 0.35)"/>
      <stop offset="100%" stop-color="rgba(247, 37, 133, 0.2)"/>
    </linearGradient>

    <!-- Treasure Chest Base -->
    <g id="treasure-chest">
      <!-- Chest Body -->
      <rect x="20" y="60" width="160" height="90" rx="12" fill="#78350F" stroke="#FBBF24" stroke-width="5"/>
      <rect x="25" y="65" width="150" height="30" fill="#92400E"/>
      <!-- Metal Bands -->
      <rect x="45" y="60" width="16" height="90" fill="#D97706"/>
      <rect x="139" y="60" width="16" height="90" fill="#D97706"/>
      <!-- Big Golden Lock / Keyhole -->
      <circle cx="100" cy="100" r="16" fill="#FBBF24" stroke="#78350F" stroke-width="3"/>
      <path d="M 100,94 L 100,104 M 97,106 L 103,106" stroke="#451A03" stroke-width="3" stroke-linecap="round"/>
      <!-- Chest Lid (Open upward) -->
      <path d="M 10,60 C 10,25 190,25 190,60 L 175,60 C 175,35 25,35 25,60 Z" fill="#92400E" stroke="#FBBF24" stroke-width="4"/>
    </g>

    <!-- Zero Snack Plate -->
    <g id="snack-plate">
      <ellipse cx="100" cy="65" rx="90" ry="45" fill="rgba(255,255,255,0.15)" stroke="#67E8F9" stroke-width="4"/>
      <ellipse cx="100" cy="65" rx="72" ry="34" fill="url(#plate-grad)" stroke="#38BDF8" stroke-width="2"/>
    </g>
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.4)"/>
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.1)"/>
    </linearGradient>

    <!-- Space Garden Planter Box -->
    <g id="space-garden-bed">
      <ellipse cx="100" cy="70" rx="90" ry="35" fill="#4B2715" stroke="#10B981" stroke-width="4"/>
      <ellipse cx="100" cy="67" rx="80" ry="28" fill="#381D0D"/>
      <!-- Magical glowing moss spots -->
      <circle cx="50" cy="65" r="4" fill="#34D399" opacity="0.8"/>
      <circle cx="100" cy="72" r="5" fill="#34D399" opacity="0.8"/>
      <circle cx="150" cy="64" r="4" fill="#34D399" opacity="0.8"/>
    </g>
  </defs>
</svg>
