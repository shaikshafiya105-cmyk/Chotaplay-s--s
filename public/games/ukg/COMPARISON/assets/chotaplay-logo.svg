<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="logo-glow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="5" y="6" width="210" height="48" rx="24" fill="url(#logo-bg)" filter="url(#logo-glow)"/>
  <circle cx="28" cy="30" r="16" fill="#FFF"/>
  <!-- Cute Play Icon / Star in Logo -->
  <polygon points="24,20 38,30 24,40" fill="#FF4081"/>

  <!-- Brand Text -->
  <text x="54" y="38" font-family="'Comic Sans MS', 'Fredoka', 'Quicksand', 'Arial Rounded MT Bold', sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="1.5">CHOTAPLAY</text>
  <!-- Sparkles -->
  <circle cx="198" cy="18" r="3" fill="#FFEB3B"/>
  <circle cx="190" cy="42" r="2.5" fill="#FFF"/>
</svg>
