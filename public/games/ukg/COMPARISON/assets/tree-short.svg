<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="short-trunk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="50%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <radialGradient id="short-foliage" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#C8E6C9"/>
      <stop offset="50%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <filter id="short-shadow">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="148" rx="45" ry="9" fill="rgba(0,0,0,0.15)"/>

  <!-- Short Trunk -->
  <path d="M 72 105 L 68 145 C 68 148 92 148 92 145 L 88 105 Z" fill="url(#short-trunk)"/>

  <!-- Cute Round Bush Foliage -->
  <circle cx="80" cy="80" r="48" fill="url(#short-foliage)" filter="url(#short-shadow)"/>
  <circle cx="55" cy="85" r="32" fill="url(#short-foliage)"/>
  <circle cx="105" cy="85" r="32" fill="url(#short-foliage)"/>
  <circle cx="80" cy="55" r="32" fill="url(#short-foliage)"/>

  <!-- Tiny flower on head -->
  <circle cx="80" cy="28" r="7" fill="#FF4081"/>
  <circle cx="73" cy="28" r="5" fill="#FF80AB"/>
  <circle cx="87" cy="28" r="5" fill="#FF80AB"/>
  <circle cx="80" cy="21" r="5" fill="#FF80AB"/>
  <circle cx="80" cy="35" r="5" fill="#FF80AB"/>
  <circle cx="80" cy="28" r="3.5" fill="#FFEB3B"/>

  <!-- Happy Face -->
  <ellipse cx="68" cy="78" rx="4" ry="5" fill="#1B5E20"/>
  <circle cx="67" cy="76" r="1.5" fill="#FFF"/>
  <ellipse cx="92" cy="78" rx="4" ry="5" fill="#1B5E20"/>
  <circle cx="91" cy="76" r="1.5" fill="#FFF"/>
  <!-- Rosy cheeks -->
  <ellipse cx="58" cy="85" rx="5" ry="3" fill="#FF8A80" opacity="0.7"/>
  <ellipse cx="102" cy="85" rx="5" ry="3" fill="#FF8A80" opacity="0.7"/>
  <!-- Smiling open mouth -->
  <path d="M 73 84 Q 80 94 87 84 Z" fill="#E91E63"/>
</svg>
