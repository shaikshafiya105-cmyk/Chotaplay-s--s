<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="apple-grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="60%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </radialGradient>
    <radialGradient id="apple-highlight" cx="30%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="apple-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Apple Body -->
  <path d="M 80 40 
           C 50 15, 10 30, 15 80 
           C 18 120, 55 150, 78 148 
           C 80 148, 80 148, 82 148 
           C 105 150, 142 120, 145 80 
           C 150 30, 110 15, 80 40 Z" 
        fill="url(#apple-grad)" filter="url(#apple-shadow)"/>
  <!-- Highlight -->
  <ellipse cx="50" cy="65" rx="20" ry="30" fill="url(#apple-highlight)" transform="rotate(-20 50 65)"/>
  <!-- Stem -->
  <path d="M 80 40 C 85 20, 95 10, 105 5" stroke="#5D4037" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- Leaf -->
  <path d="M 82 32 C 95 20, 120 22, 125 35 C 115 45, 90 42, 82 32 Z" fill="#4CAF50"/>
  <path d="M 85 33 Q 105 28 122 34" stroke="#2E7D32" stroke-width="1.5" fill="none"/>
  <!-- Cute Face Option -->
  <circle cx="60" cy="85" r="4.5" fill="#3E2723"/>
  <circle cx="58.5" cy="83" r="1.5" fill="#FFFFFF"/>
  <circle cx="100" cy="85" r="4.5" fill="#3E2723"/>
  <circle cx="98.5" cy="83" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="48" cy="92" rx="5" ry="3" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="112" cy="92" rx="5" ry="3" fill="#FF8A80" opacity="0.6"/>
  <path d="M 73 93 Q 80 102 87 93" stroke="#880e4f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
