<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="mouse-body" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="60%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#607D8B"/>
    </radialGradient>
    <radialGradient id="mouse-pink" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFCDD2"/>
      <stop offset="100%" stop-color="#F48FB1"/>
    </radialGradient>
  </defs>

  <!-- Tail -->
  <path d="M 120 110 C 150 115, 155 70, 130 65" stroke="#F48FB1" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="90" cy="100" rx="35" ry="28" fill="url(#mouse-body)"/>

  <!-- Cute Big Round Ears -->
  <circle cx="55" cy="55" r="18" fill="url(#mouse-body)"/>
  <circle cx="55" cy="55" r="12" fill="url(#mouse-pink)"/>
  <circle cx="85" cy="52" r="16" fill="url(#mouse-body)"/>
  <circle cx="85" cy="52" r="10" fill="url(#mouse-pink)"/>

  <!-- Head -->
  <path d="M 85 80 C 85 95, 60 110, 42 98 C 30 90, 30 75, 45 70 C 65 65, 85 68, 85 80 Z" fill="url(#mouse-body)"/>

  <!-- Nose -->
  <circle cx="32" cy="85" r="4.5" fill="#F48FB1"/>

  <!-- Whiskers -->
  <line x1="28" y1="82" x2="10" y2="76" stroke="#546E7A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="28" y1="88" x2="12" y2="94" stroke="#546E7A" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38" y1="85" x2="22" y2="85" stroke="#546E7A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Eye -->
  <ellipse cx="50" cy="78" rx="4.5" ry="6" fill="#263238"/>
  <circle cx="48.5" cy="75.5" r="1.8" fill="#FFF"/>
  <ellipse cx="56" cy="88" rx="4" ry="2.5" fill="#FF8A80" opacity="0.6"/>

  <!-- Cheese Slice in Hands -->
  <polygon points="40,105 60,118 45,130" fill="#FFD54F" stroke="#FFA000" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="48" cy="115" r="2.5" fill="#FFB300"/>
  <circle cx="53" cy="122" r="1.8" fill="#FFB300"/>
  <!-- Paws -->
  <ellipse cx="44" cy="110" rx="4" ry="3" fill="#CFD8DC"/>
  <ellipse cx="55" cy="114" rx="4" ry="3" fill="#CFD8DC"/>
</svg>
