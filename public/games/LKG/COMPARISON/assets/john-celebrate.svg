<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%">
  <defs>
    <radialGradient id="skin-cel" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFE0BD"/>
      <stop offset="100%" stop-color="#F3C398"/>
    </radialGradient>
    <linearGradient id="hair-cel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3A19"/>
      <stop offset="100%" stop-color="#451F07"/>
    </linearGradient>
    <linearGradient id="shirt-cel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="shorts-cel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </linearGradient>
    <linearGradient id="shoe-cel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E1F5FE"/>
      <stop offset="100%" stop-color="#03A9F4"/>
    </linearGradient>
    <filter id="shadow-cel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="285" rx="45" ry="8" fill="rgba(0,0,0,0.15)"/>

  <!-- Legs Jumping -->
  <path d="M 72 195 L 65 240 L 78 243 L 88 195 Z" fill="url(#skin-cel)"/>
  <path d="M 112 195 L 122 240 L 135 237 L 128 195 Z" fill="url(#skin-cel)"/>
  <!-- Socks -->
  <rect x="63" y="235" width="16" height="15" rx="3" fill="#81D4FA" transform="rotate(-5 71 242)"/>
  <rect x="121" y="232" width="16" height="15" rx="3" fill="#81D4FA" transform="rotate(5 129 239)"/>
  <!-- Shoes -->
  <path d="M 52 250 C 52 240 70 240 80 245 C 85 248 84 260 78 263 C 65 264 52 260 52 250 Z" fill="url(#shoe-cel)"/>
  <path d="M 120 248 C 120 238 138 238 148 243 C 153 246 152 258 146 261 C 133 262 120 258 120 248 Z" fill="url(#shoe-cel)"/>

  <!-- Shorts -->
  <path d="M 68 150 L 132 150 L 136 200 L 108 202 L 100 170 L 92 202 L 64 200 Z" fill="url(#shorts-cel)" filter="url(#shadow-cel)"/>

  <!-- Torso / Shirt -->
  <path d="M 60 100 L 140 100 L 135 155 L 65 155 Z" fill="url(#shirt-cel)" filter="url(#shadow-cel)"/>
  <!-- Rocket Graphic on Shirt -->
  <g transform="translate(100, 125) scale(0.6)">
    <path d="M 0 -22 C 8 -12 8 10 0 16 C -8 10 -8 -12 0 -22 Z" fill="#FFF"/>
    <path d="M 0 -22 C 4 -18 4 -12 0 -10 C -4 -12 -4 -18 0 -22 Z" fill="#E53935"/>
    <circle cx="0" cy="0" r="4" fill="#0288D1"/>
    <path d="M -6 6 L -14 14 L -6 14 Z" fill="#FB8C00"/>
    <path d="M 6 6 L 14 14 L 6 14 Z" fill="#FB8C00"/>
    <path d="M -4 16 C 0 26 0 26 4 16 Z" fill="#FFEB3B"/>
  </g>

  <!-- Both Arms Raised Up in Victory/Celebration -->
  <path d="M 65 100 L 30 55 C 24 50 15 62 22 70 L 55 110 Z" fill="url(#skin-cel)"/>
  <path d="M 135 100 L 170 55 C 176 50 185 62 178 70 L 145 110 Z" fill="url(#skin-cel)"/>
  <!-- Sleeves -->
  <path d="M 58 95 L 45 75 L 60 70 L 72 95 Z" fill="url(#shirt-cel)"/>
  <path d="M 142 95 L 155 75 L 140 70 L 128 95 Z" fill="url(#shirt-cel)"/>
  <rect x="23" y="60" width="8" height="6" rx="2" fill="#FF7043" transform="rotate(30 27 63)"/>

  <!-- Neck -->
  <rect x="90" y="88" width="20" height="15" rx="4" fill="url(#skin-cel)"/>

  <!-- Head -->
  <ellipse cx="100" cy="62" rx="42" ry="40" fill="url(#skin-cel)" filter="url(#shadow-cel)"/>

  <!-- Ears -->
  <circle cx="58" cy="65" r="10" fill="url(#skin-cel)"/>
  <circle cx="58" cy="65" r="6" fill="#F3C398"/>
  <circle cx="142" cy="65" r="10" fill="url(#skin-cel)"/>
  <circle cx="142" cy="65" r="6" fill="#F3C398"/>

  <!-- Hair -->
  <path d="M 55 55 C 50 30 75 10 100 12 C 120 14 140 22 145 42 C 150 48 145 60 140 62 C 135 45 125 35 105 32 C 85 30 70 42 62 58 Z" fill="url(#hair-cel)"/>
  <path d="M 90 12 C 95 0 115 5 110 18 Z" fill="url(#hair-cel)"/>

  <!-- Happy Closed Arc Eyes -->
  <path d="M 78 60 Q 86 50 94 60" stroke="#2D1500" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 106 60 Q 114 50 122 60" stroke="#2D1500" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="73" cy="70" rx="9" ry="6" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="127" cy="70" rx="9" ry="6" fill="#FF8A80" opacity="0.6"/>

  <!-- Big Open Laughing Mouth -->
  <path d="M 85 72 Q 100 70 115 72 Q 100 96 85 72 Z" fill="#D81B60"/>
  <path d="M 90 85 Q 100 78 110 85 Q 100 95 90 85 Z" fill="#FF8A80"/>
  <!-- Sparkles around hands -->
  <polygon points="15,40 18,48 26,51 18,54 15,62 12,54 4,51 12,48" fill="#FFD700"/>
  <polygon points="185,40 188,48 196,51 188,54 185,62 182,54 174,51 182,48" fill="#FFD700"/>
</svg>
