<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <radialGradient id="p2-body" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="60%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <linearGradient id="p2-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="p2-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFE082" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Back of Ring -->
  <ellipse cx="120" cy="120" rx="100" ry="30" fill="none" stroke="url(#p2-ring)" stroke-width="10" transform="rotate(22 120 120)" opacity="0.7"/>

  <!-- Planet Sphere -->
  <circle cx="120" cy="120" r="70" fill="url(#p2-body)" filter="url(#p2-glow)"/>

  <!-- Swirls / Craters -->
  <ellipse cx="100" cy="95" rx="15" ry="10" fill="#F57C00" opacity="0.5"/>
  <ellipse cx="140" cy="140" rx="18" ry="11" fill="#F57C00" opacity="0.5"/>
  <ellipse cx="135" cy="88" rx="10" ry="7" fill="#FFE082" opacity="0.5"/>

  <!-- Front of Ring -->
  <path d="M 25 90 C 50 45 190 95 215 150" fill="none" stroke="url(#p2-ring)" stroke-width="10" stroke-linecap="round"/>

  <!-- Cute Eyes on Planet -->
  <circle cx="105" cy="115" r="4.5" fill="#FFF"/>
  <circle cx="106" cy="115" r="2.8" fill="#4E342E"/>
  <circle cx="135" cy="115" r="4.5" fill="#FFF"/>
  <circle cx="136" cy="115" r="2.8" fill="#4E342E"/>
  <ellipse cx="95" cy="122" rx="5" ry="3.5" fill="#FF5252" opacity="0.6"/>
  <ellipse cx="145" cy="122" rx="5" ry="3.5" fill="#FF5252" opacity="0.6"/>
  <path d="M 115 124 Q 120 130 125 124" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
