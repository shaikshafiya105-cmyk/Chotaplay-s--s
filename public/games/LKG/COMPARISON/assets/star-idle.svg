<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150" width="100%" height="100%">
  <defs>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFD54F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFCA28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="star-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#FFA000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Glow -->
  <circle cx="75" cy="75" r="70" fill="url(#star-glow)"/>

  <!-- Star Body with Rounded Points -->
  <path d="M 75 18 
           C 78 26, 85 45, 93 52 
           C 102 54, 126 55, 133 60 
           C 137 65, 124 78, 117 85 
           C 116 93, 120 118, 114 123 
           C 108 126, 90 115, 82 112 
           C 75 111, 60 125, 54 122 
           C 48 117, 52 93, 51 85 
           C 44 78, 31 65, 35 60 
           C 42 55, 66 54, 75 52 Z" 
        fill="url(#star-body)" filter="url(#star-shadow)"/>

  <!-- Eyes -->
  <ellipse cx="64" cy="72" rx="4.5" ry="6" fill="#3E2723"/>
  <circle cx="62.5" cy="69.5" r="2" fill="#FFFFFF"/>
  <circle cx="65.5" cy="74" r="1" fill="#FFFFFF"/>

  <!-- Right Eye (Winking or Cute Open) -->
  <ellipse cx="86" cy="72" rx="4.5" ry="6" fill="#3E2723"/>
  <circle cx="84.5" cy="69.5" r="2" fill="#FFFFFF"/>
  <circle cx="87.5" cy="74" r="1" fill="#FFFFFF"/>

  <!-- Cheeks -->
  <ellipse cx="54" cy="80" rx="6" ry="4" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="96" cy="80" rx="6" ry="4" fill="#FF8A80" opacity="0.6"/>

  <!-- Happy Smile -->
  <path d="M 68 82 Q 75 92 82 82" stroke="#E65100" stroke-width="2.5" stroke-linecap="round" fill="#FF5252"/>

  <!-- Wand / Star Wand in Hand -->
  <g transform="translate(105, 82) rotate(25)">
    <line x1="0" y1="0" x2="16" y2="16" stroke="#8D6E63" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="18,18 20,23 25,24 20,26 18,31 16,26 11,24 16,23" fill="#00E5FF"/>
  </g>

  <!-- Sparkles -->
  <polygon points="25,30 27,35 32,37 27,39 25,44 23,39 18,37 23,35" fill="#FFF"/>
  <polygon points="125,35 127,39 131,41 127,43 125,47 123,43 119,41 123,39" fill="#FFF"/>
</svg>
